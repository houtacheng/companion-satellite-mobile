plugins { id 'com.android.application' }

android {
    namespace 'com.companion.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.companion.mobile'
        minSdk 26
        targetSdk 35
        versionCode 51
        versionName '2.38.8'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
}
